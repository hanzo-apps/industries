
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hanzo Industries - United in Securing AI</title>
    <meta name="description" content="Frontier AI research lab building safe, aligned, and decentralized AI systems. Specializing in private edge AI deployment, alignment research, and mission-critical defense applications." />
    <meta name="author" content="hanzo.ai" />
    <meta property="og:image" content="/og-image.png" />
    <link rel="icon" href="/hanzo-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100;200;300;400;500;600;700;800;900&family=Geist+Mono:wght@100;200;300;400;500;600;700;800;900&display=swap" />
  </head>
  <body>
    <script>
      // Blocking theme init — prevents flash of wrong theme
      (function() {
        var mode = localStorage.getItem('theme-mode') || 'light';
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
        document.documentElement.style.backgroundColor = dark ? '#000' : '#fff';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
