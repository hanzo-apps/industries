# Static export with `images: { unoptimized: true }` — Next never calls sharp, so
# its native build is work this app cannot use.
allowBuilds:
  sharp: false

# pnpm 11 refuses a package published inside its cooldown window. These four pins
# carry the Zen faces and the matching token block, so the app cannot resolve
# without them. Exact versions, so the list expires the moment they age out.
minimumReleaseAgeExclude:
  - '@hanzo/design@0.5.18 || 0.5.21'
  - '@hanzo/font@1.8.2'
  - '@hanzo/ui@8.3.4'
