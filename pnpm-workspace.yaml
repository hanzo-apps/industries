# Static export with `images: { unoptimized: true }` — Next never calls sharp, so
# its native build is work this app cannot use.
allowBuilds:
  sharp: false

# pnpm 11 refuses a package published inside its cooldown window, and this app
# runs on the Zen faces, the matching token block, the 8.2.0 gui line and the
# mark — all published today. pnpm writes each exclusion it needs, which is why
# the list is long; every entry names an EXACT version, so it expires as those
# age out rather than standing as a blanket exemption.
minimumReleaseAgeExclude:
  - '@hanzo/design@0.5.18 || 0.5.21'
  - '@hanzo/font@1.8.2'
  - '@hanzo/ui@8.3.4'
  - '@hanzo/gui@8.2.0'
